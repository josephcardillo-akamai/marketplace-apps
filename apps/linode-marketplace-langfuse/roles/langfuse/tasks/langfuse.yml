---
- name: Create Langfuse install directory
  file:
    path: "{{ langfuse_base_dir }}"
    state: directory
    mode: '0755'

- name: Deploy environment file
  template:
    src: env.j2
    dest: "{{ langfuse_base_dir }}/.env"
    mode: '0600'

- name: Deploy docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ langfuse_base_dir }}/docker-compose.yml"
    mode: '0644'

# Staged start: bring the datastores up healthy BEFORE the web/worker run their migrations.
# Starting all six at once races the ClickHouse-migration step against Docker's embedded DNS and
# crash-loops the web container (manual_install.md §3 "first-boot ClickHouse-migration DNS race").
- name: Start backing services (postgres, redis, clickhouse{{ '' if obj_enabled | bool else ', minio' }})
  community.docker.docker_compose_v2:
    project_src: "{{ langfuse_base_dir }}"
    services: "{{ ['postgres', 'redis', 'clickhouse'] if obj_enabled | bool else ['postgres', 'redis', 'clickhouse', 'minio'] }}"
    state: present
    pull: always
    wait: true
  register: backing_services
  retries: 3
  delay: 10
  until: backing_services is succeeded

- name: Start Langfuse web and worker
  community.docker.docker_compose_v2:
    project_src: "{{ langfuse_base_dir }}"
    state: present
    pull: always

- name: Wait for Langfuse web to listen on {{ langfuse_port }}
  wait_for:
    host: 127.0.0.1
    port: "{{ langfuse_port }}"
    timeout: 300

# First boot runs ~420 Prisma migrations plus LANGFUSE_INIT_* headless init before the API is
# healthy (manual_install.md §3/§6). Poll until it reports OK.
- name: Wait for Langfuse health check to report OK
  uri:
    url: "http://127.0.0.1:{{ langfuse_port }}/api/public/health"
    return_content: true
  register: langfuse_health
  until: langfuse_health.json is defined and langfuse_health.json.status == 'OK'
  retries: 40
  delay: 10
