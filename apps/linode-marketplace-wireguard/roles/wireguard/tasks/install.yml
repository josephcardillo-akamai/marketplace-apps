---
- name: Install required packages for WireGuard
  apt:
    name:
      - wireguard
      - wireguard-tools
    state: present
    update_cache: true

- name: Create WireGuard directory
  file:
    path: /etc/wireguard
    state: directory
    mode: '0750'
    
- name: Generate and save private key
  shell: "umask 077 && wg genkey | tee /etc/wireguard/private.key"
  args:
    creates: /etc/wireguard/private.key
  register: private_key

- name: Generate and save public key
  shell: "wg pubkey < /etc/wireguard/private.key | tee /etc/wireguard/public.key"
  args:
    creates: /etc/wireguard/public.key
  register: public_key

- name: Create WireGuard configuration file
  template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: '0640'

- name: Enable IP forwarding
  lineinfile:
    path: /etc/sysctl.conf
    line: "net.ipv4.ip_forward=1"
    state: present

- name: Apply sysctl settings
  command: sysctl -p

- name: Enable and start WireGuard service
  systemd:
    name: "wg-quick@wg0"
    state: started
    enabled: true

