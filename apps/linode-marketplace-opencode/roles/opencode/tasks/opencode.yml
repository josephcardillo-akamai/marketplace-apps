---
# - name: Install OpenCode
#   shell:
#     cmd: set -o pipefail && curl -fsSL https://opencode.ai/install | bash
#     executable: /bin/bash
#     creates: "{{ ansible_env.HOME }}/.opencode/bin/opencode"

- name: Download OpenCode installer
  ansible.builtin.get_url:
    url: https://opencode.ai/install
    dest: /tmp/opencode-install.sh
    mode: '0755'

- name: Install OpenCode
  ansible.builtin.command:
    cmd: /tmp/opencode-install.sh
