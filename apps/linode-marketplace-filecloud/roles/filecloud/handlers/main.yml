- name: start apache2
  service:
    name: apache2
    state: started

- name: restart apache
  service:
    name: apache2
    state: restarted

- name: restart mongodb
  service:
    name: mongodb
    state: restarted

- name: restart solr
  service:
    name: solr
    state: restarted

- name: restart filecloud
  service:
    name: filecloud
    state: restarted
