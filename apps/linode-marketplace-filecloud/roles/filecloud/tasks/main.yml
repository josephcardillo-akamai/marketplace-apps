---
# FileCloud installation
- name: Add MongoDB and FileCloud repositories
  import_role:
    name: repos

- name: Install MongoDB
  import_role:
    name: mongodb

- name: Install Apache
  import_role:
    name: apache

- name: Install PHP
  import_role:
    name: php

- name: Install and Configure FileCloud
  import_role:
    name: filecloud

- name: Install SSL
  import_role:
    name: ssl