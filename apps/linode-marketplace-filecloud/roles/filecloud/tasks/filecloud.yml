---
- name: Install FileCloud
  apt:
    name: filecloud
    state: present
    environment:
      ACCEPT_EULA: "Y"
  notify: restart apache2

- name: Reset FileCloud admin password
  command: 'php resetadminpw.php -p "{{ filecloud_admin_password }}"'
  args:
    chdir: '/var/www/html/resources/backup/'

- name: Authenticate with FileCloud admin interface
  uri:
    url: http://{{ ansible_default_ipv4.address }}/admin/adminlogin?adminuser=admin&adminpassword={{ filecloud_admin_password }}
    method: GET
    body_format: form-urlencoded
    status_code: 200
    force_basic_auth: yes
  register: login_cookies

- name: Store authentication cookies
  set_fact:
    login: "{{ login_cookies.cookies }}"

- name: Extract tonidocloud_ah cookie value
  set_fact:
    tonidocloud_ah: "{{ login['tonidocloud-ah'] }}"

- name: Extract tonidocloud_as cookie value
  set_fact:
    tonidocloud_as: "{{ login['tonidocloud-as'] }}"

- name: Extract XSRF token value
  set_fact:
    x_xsrf_token: "{{ login['X-XSRF-TOKEN'] }}"

- name: Configure GEO IP settings
  uri:
    url: http://{{ ansible_default_ipv4.address }}/admin/
    method: POST
    headers:
      Content-Type: application/x-www-form-urlencoded
      Cookie: X-XSRF-TOKEN-admin={{ x_xsrf_token }}; X-XSRF-TOKEN={{ x_xsrf_token }}; tonidocloud-au=admin; tonidocloud-as={{ tonidocloud_as }}; tonidocloud-ah={{ tonidocloud_ah }}; tonidocloud-ah={{ tonidocloud_ah }}; tonidocloud-as={{ tonidocloud_as }}; tonidocloud-au=admin
    body_format: form-urlencoded
    body:
      op: "setconfigsetting"
      count: "1"
      param0: "TONIDOCLOUD_GEOIP_ENABLED"
      value0: "1"

- name: Remove FileCloud installation directory
  file:
    path: /var/www/html/install
    state: absent

- name: Configure FileCloud server URL
  lineinfile:
    path: /var/www/html/config/cloudconfig.php
    regexp: '^define\("TONIDOCLOUD_SERVER_URL"'
    line: 'define("TONIDOCLOUD_SERVER_URL", "https://{{ _domain }}" );'
    create: false
  notify: restart apache2

- name: Configure FileCloud reply to email
  lineinfile:
    path: /var/www/html/config/cloudconfig.php
    regexp: '^define\("TONIDOCLOUD_REPLY_TO_EMAIL"'
    line: 'define("TONIDOCLOUD_REPLY_TO_EMAIL", "{{ soa_email_address }}" );'
    create: false
  notify: restart apache2

- name: Configure FileCloud reply from email
  lineinfile:
    path: /var/www/html/config/cloudconfig.php
    regexp: '^define\("TONIDOCLOUD_REPLY_FROM_EMAIL"'
    line: 'define("TONIDOCLOUD_REPLY_FROM_EMAIL", "{{ soa_email_address }}" );'
    create: false
  notify: restart apache2

- name: Configure FileCloud secure cookie
  lineinfile:
    path: /var/www/html/config/cloudconfig.php
    regexp: '^define\("TONIDOCLOUD_SECURE_COOKIE"'
    line: 'define("TONIDOCLOUD_SECURE_COOKIE", 1);'
    create: false
  notify: restart apache2
